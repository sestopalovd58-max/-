<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>IRON LOG — тренировочный дневник</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=Roboto+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#12151c;
    --surface:#1b212b;
    --surface-2:#242c39;
    --surface-3:#2e3747;
    --iron:#ff6b35;
    --iron-dim:#a84c27;
    --chalk:#3ecf8e;
    --danger:#ff5470;
    --steel:#8b93a7;
    --text:#edeff3;
    --border:#2c3442;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:radial-gradient(circle at 50% 0%, #1a2030 0%, #0c0e13 65%);
    min-height:100vh;
    display:flex;
    align-items:flex-start;
    justify-content:center;
    font-family:'Inter',sans-serif;
    color:var(--text);
    padding:24px 8px;
  }
  .phone{
    width:100%;
    max-width:430px;
    background:var(--bg);
    border-radius:34px;
    border:1px solid #2a3140;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.7), inset 0 0 0 1px rgba(255,255,255,.02);
    overflow:hidden;
    display:flex;
    flex-direction:column;
    height:860px;
    position:relative;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%);
    width:120px; height:22px; background:var(--bg); border-radius:0 0 14px 14px; z-index:50;
  }
  .topbar{
    padding:26px 20px 14px;
    background:linear-gradient(180deg, #171c26 0%, rgba(23,28,38,0) 100%);
    flex-shrink:0;
  }
  .topbar .eyebrow{
    font-family:'Roboto Mono', monospace;
    font-size:11px; letter-spacing:2px; color:var(--iron); text-transform:uppercase; font-weight:700;
  }
  .topbar h1{
    font-family:'Bebas Neue', sans-serif;
    font-size:32px; letter-spacing:1px; margin:2px 0 0; line-height:1;
  }
  .content{
    flex:1; overflow-y:auto; padding:4px 18px 100px;
    scrollbar-width:none;
  }
  .content::-webkit-scrollbar{display:none;}

  /* ---- muscle grid ---- */
  .muscle-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:8px;}
  .muscle-card{
    background:var(--surface); border:1px solid var(--border); border-radius:18px;
    padding:16px 14px; cursor:pointer; position:relative; overflow:hidden;
    transition:transform .15s ease, border-color .15s ease;
  }
  .muscle-card:active{transform:scale(.96);}
  .muscle-card:hover{border-color:var(--iron-dim);}
  .muscle-card .icon{width:30px;height:30px; color:var(--iron); margin-bottom:10px;}
  .muscle-card .name{font-family:'Bebas Neue',sans-serif; font-size:20px; letter-spacing:.5px;}
  .muscle-card .count{font-family:'Roboto Mono',monospace; font-size:11px; color:var(--steel); margin-top:2px;}

  /* ---- section header ---- */
  .section-title{
    font-family:'Bebas Neue',sans-serif; font-size:15px; letter-spacing:2px; color:var(--steel);
    text-transform:uppercase; margin:22px 0 10px; display:flex; align-items:center; gap:8px;
  }
  .section-title::after{content:''; flex:1; height:1px; background:var(--border);}

  /* ---- back row ---- */
  .backrow{display:flex; align-items:center; gap:10px; margin-bottom:6px; cursor:pointer; color:var(--steel); font-size:13px; font-weight:600;}
  .backrow svg{width:16px;height:16px;}
  .backrow:active{opacity:.6;}

  /* ---- exercise card ---- */
  .ex-card{
    background:var(--surface); border:1px solid var(--border); border-radius:16px;
    padding:14px 14px; margin-bottom:10px;
  }
  .ex-head{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; cursor:pointer;}
  .ex-name{font-weight:700; font-size:15px;}
  .ex-muscle-tag{font-family:'Roboto Mono',monospace; font-size:10px; color:var(--steel); text-transform:uppercase; letter-spacing:1px; margin-top:2px;}
  .ex-add-btn{
    flex-shrink:0; background:var(--surface-2); border:1px solid var(--border); color:var(--iron);
    width:32px; height:32px; border-radius:10px; font-size:18px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }
  .ex-add-btn.added{background:var(--chalk); color:#0c0e13; border-color:var(--chalk);}
  .ex-instruction{
    margin-top:10px; padding-top:10px; border-top:1px dashed var(--border);
    font-size:13px; line-height:1.55; color:#c3c9d6; display:none;
  }
  .ex-instruction.open{display:block;}
  .ex-instruction .lbl{font-family:'Roboto Mono',monospace; font-size:10px; color:var(--iron); letter-spacing:1px; text-transform:uppercase; display:block; margin-bottom:4px;}
  .gif-box{background:var(--surface-2); border:1px solid var(--border); border-radius:12px; padding:8px 8px 6px; margin-bottom:10px;}
  .gif-box svg{display:block; width:100%; height:auto;}
  .gif-cap{font-family:'Roboto Mono',monospace; font-size:10px; color:var(--steel); text-align:center; margin-top:2px; letter-spacing:.3px;}
  .tag-custom{display:inline-block; font-family:'Roboto Mono',monospace; font-size:9px; color:var(--chalk); border:1px solid var(--chalk); border-radius:6px; padding:1px 5px; margin-left:6px; vertical-align:middle;}
  .add-custom-btn{width:100%; margin-top:6px; background:none; border:1px dashed var(--iron-dim); color:var(--iron); border-radius:12px; padding:12px; font-size:13px; font-weight:700; cursor:pointer;}
  .add-custom-btn:active{transform:scale(.98);}
  .custom-form{background:var(--surface); border:1px solid var(--iron-dim); border-radius:14px; padding:12px; margin-top:6px;}
  .custom-form input, .custom-form textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'Inter',sans-serif; font-size:13px; padding:9px; margin-bottom:8px; resize:vertical;
  }
  .custom-form input:focus, .custom-form textarea:focus{outline:none; border-color:var(--iron);}
  .cf-btns{display:flex; gap:8px;}
  .cf-btns button{flex:1; padding:10px; border-radius:10px; font-size:13px; font-weight:700; cursor:pointer; border:none;}
  .cf-save{background:var(--iron); color:#181008;}
  .cf-cancel{background:var(--surface-2); color:var(--steel); border:1px solid var(--border);}
  .del-custom{display:block; margin-top:8px; background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer; padding:0;}

  /* ---- session card ---- */
  .session-box{
    background:linear-gradient(155deg,#1e2531,#171c26); border:1px solid var(--iron-dim);
    border-radius:18px; padding:14px; margin-bottom:16px;
  }
  .session-box .stitle{font-family:'Bebas Neue',sans-serif; font-size:18px; color:var(--iron); letter-spacing:1px;}
  .session-ex{background:var(--surface-2); border-radius:14px; padding:12px; margin-top:10px;}
  .session-ex-top{display:flex; justify-content:space-between; align-items:center;}
  .session-ex-top .n{font-weight:700; font-size:14px;}
  .rm-btn{background:none; border:none; color:var(--steel); font-size:12px; cursor:pointer;}
  .sets-table{margin-top:8px;}
  .set-row{display:grid; grid-template-columns:26px 1fr 1fr 34px; gap:6px; align-items:center; margin-bottom:6px;}
  .set-row .idx{font-family:'Roboto Mono',monospace; font-size:12px; color:var(--steel); text-align:center;}
  .set-row input{
    width:100%; background:var(--surface-3); border:1px solid var(--border); border-radius:8px;
    color:var(--text); font-family:'Roboto Mono',monospace; font-size:13px; padding:7px 6px; text-align:center;
  }
  .set-row input:focus{outline:none; border-color:var(--iron);}
  .set-row .chk{
    width:30px; height:30px; border-radius:8px; border:1px solid var(--border); background:var(--surface-3);
    color:var(--steel); cursor:pointer; font-size:14px; display:flex; align-items:center; justify-content:center;
  }
  .set-row .chk.done{background:var(--chalk); color:#0c0e13; border-color:var(--chalk);}
  .add-set-btn{
    width:100%; margin-top:4px; background:none; border:1px dashed var(--border); color:var(--steel);
    border-radius:8px; padding:7px; font-size:12px; cursor:pointer; font-weight:600;
  }
  .finish-btn{
    width:100%; margin-top:6px; background:var(--iron); border:none; color:#181008; font-weight:700;
    padding:13px; border-radius:12px; font-size:14px; cursor:pointer; letter-spacing:.3px;
  }
  .finish-btn:active{transform:scale(.98);}
  .empty-hint{
    text-align:center; color:var(--steel); font-size:13px; padding:30px 10px; line-height:1.6;
  }

  /* ---- timer ---- */
  .timer-wrap{display:flex; flex-direction:column; align-items:center; padding-top:10px;}
  .plate{position:relative; width:230px; height:230px; margin-top:6px;}
  .plate svg{width:100%; height:100%; transform:rotate(-90deg);}
  .plate-ring-bg{fill:none; stroke:var(--surface-2); stroke-width:14;}
  .plate-ring{fill:none; stroke:var(--iron); stroke-width:14; stroke-linecap:round; transition:stroke-dashoffset .25s linear;}
  .plate-center{
    position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .plate-center .digits{font-family:'Roboto Mono',monospace; font-size:42px; font-weight:700;}
  .plate-center .lbl2{font-size:11px; color:var(--steel); letter-spacing:2px; text-transform:uppercase; margin-top:2px;}
  .timer-controls{display:flex; gap:10px; margin-top:26px;}
  .tbtn{
    background:var(--surface-2); border:1px solid var(--border); color:var(--text);
    padding:12px 20px; border-radius:12px; font-weight:700; cursor:pointer; font-size:13px;
  }
  .tbtn.primary{background:var(--iron); color:#181008; border:none;}
  .tbtn:active{transform:scale(.95);}
  .presets{display:flex; gap:8px; margin-top:22px; flex-wrap:wrap; justify-content:center;}
  .preset{
    background:var(--surface); border:1px solid var(--border); color:var(--steel);
    padding:8px 14px; border-radius:20px; font-size:12px; font-family:'Roboto Mono',monospace; cursor:pointer;
  }
  .preset.active{background:var(--surface-2); color:var(--iron); border-color:var(--iron-dim);}
  .custom-row{display:flex; gap:8px; align-items:center; margin-top:18px;}
  .custom-row input{
    width:80px; background:var(--surface-2); border:1px solid var(--border); border-radius:10px;
    color:var(--text); font-family:'Roboto Mono',monospace; padding:9px; text-align:center; font-size:14px;
  }
  .custom-row span{font-size:12px; color:var(--steel);}
  .custom-row button{
    background:var(--surface-2); border:1px solid var(--border); color:var(--chalk); border-radius:10px;
    padding:9px 14px; font-size:12px; font-weight:700; cursor:pointer;
  }

  /* ---- history ---- */
  .hist-card{background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:14px; margin-bottom:12px;}
  .hist-top{display:flex; justify-content:space-between; align-items:baseline; cursor:pointer;}
  .hist-date{font-family:'Bebas Neue',sans-serif; font-size:18px; letter-spacing:.5px; color:var(--iron);}
  .hist-meta{font-family:'Roboto Mono',monospace; font-size:11px; color:var(--steel);}
  .hist-body{display:none; margin-top:10px; border-top:1px dashed var(--border); padding-top:10px;}
  .hist-body.open{display:block;}
  .hist-ex-line{font-size:13px; margin-bottom:6px; color:#c3c9d6;}
  .hist-ex-line b{color:var(--text);}
  .hist-note{
    margin-top:8px; background:var(--surface-2); border-radius:10px; padding:8px 10px; font-size:12px;
    color:#c3c9d6; font-style:italic; border-left:2px solid var(--iron-dim);
  }
  .del-hist{background:none; border:none; color:var(--danger); font-size:11px; cursor:pointer; margin-top:8px;}

  /* ---- bottom nav ---- */
  .navbar{
    position:absolute; bottom:0; left:0; right:0; height:80px; background:#151a23;
    border-top:1px solid var(--border); display:flex; padding-bottom:14px; z-index:40;
  }
  .navitem{
    flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px;
    color:var(--steel); cursor:pointer; font-size:10px; font-weight:700; letter-spacing:.3px;
  }
  .navitem svg{width:22px; height:22px;}
  .navitem.active{color:var(--iron);}

  .note-textarea{
    width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:12px;
    color:var(--text); font-family:'Inter',sans-serif; font-size:13px; padding:10px; resize:none; min-height:60px;
  }
  .note-textarea:focus{outline:none; border-color:var(--iron);}
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="notch"></div>
  <div class="topbar">
    <div class="eyebrow">Iron Log</div>
    <h1 id="screenTitle">Тренировка</h1>
  </div>
  <div class="content" id="content"></div>

  <div class="navbar">
    <div class="navitem" data-tab="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6.5 3v18M17.5 3v18M3 8.5h6M15 8.5h6M3 15.5h6M15 15.5h6"/></svg>
      Тренировка
    </div>
    <div class="navitem" data-tab="library">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V4H6.5A2.5 2.5 0 0 0 4 6.5v13Z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20"/></svg>
      Упражнения
    </div>
    <div class="navitem" data-tab="timer">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2M9 2h6M12 2v3"/></svg>
      Таймер
    </div>
    <div class="navitem" data-tab="history">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4v6h6M4.5 15a8 8 0 1 0 2-8.5L4 10"/></svg>
      История
    </div>
  </div>
</div>

<script>
/* ============ ДАННЫЕ ============ */
const MUSCLES = [
  {id:'chest', name:'Грудь', icon:'M4 12c2-6 6-8 8-8s6 2 8 8c-2 6-6 8-8 8s-6-2-8-8Z'},
  {id:'back', name:'Спина', icon:'M6 3v18M18 3v18M6 8h12M6 16h12'},
  {id:'legs', name:'Ноги', icon:'M9 3h2l1 8-2 10H8l1-9M15 3h2l1 9-1 9h-2l-1-9'},
  {id:'shoulders', name:'Плечи', icon:'M4 10c1-4 4-6 8-6s7 2 8 6M3 14c2-1 4-1 6 0M15 14c2-1 4-1 6 0'},
  {id:'triceps', name:'Трицепс', icon:'M8 3v8l-3 10h3l3-10V3M16 3v8l3 10h-3l-3-10V3'},
  {id:'biceps', name:'Бицепс', icon:'M6 4c0 6 1 9 3 11s3 5 3 5M18 4c0 6-1 9-3 11'},
  {id:'abs', name:'Пресс', icon:'M7 3h10v18H7z M7 8h10M7 13h10'},
  {id:'cardio', name:'Кардио', icon:'M3 12h4l2-7 4 14 2-9 2 2h4'}
];

const EXERCISES = {
  chest:[
    {n:'Жим штанги лёжа', t:'Лягте на скамью, стопы плотно упираются в пол, поясница сохраняет естественный прогиб, лопатки сведены и прижаты к скамье. Хват чуть шире плеч. Снимите штангу с упоров, опустите её медленно к середине груди по слегка дугообразной траектории, локти уходят под углом около 45–60° к корпусу. Выжмите штангу вверх мощно, но без резкого разгибания локтей в замок, выдыхайте на усилии.'},
    {n:'Жим гантелей на наклонной скамье', t:'Установите скамью под углом 30–45°. Гантели держите на уровне верхней части груди, локти примерно под 45° к корпусу. Опускайте гантели медленно до лёгкого растяжения груди, затем выжимайте вверх по дуге, сводя гантели ближе друг к другу вверху, но не сталкивая их резко.'},
    {n:'Жим гантелей на скамье с отрицательным наклоном', t:'Зафиксируйте ноги в упорах скамьи с отрицательным наклоном 15–30°. Гантели опускайте к нижней части груди, локти двигаются близко к корпусу. Движение вверх выполняйте подконтрольно, избегая резкого прилива крови к голове при долгом удержании позиции.'},
    {n:'Отжимания от пола', t:'Руки поставьте чуть шире плеч, пальцы направлены вперёд. Тело должно быть прямой линией от головы до пяток, живот и ягодицы напряжены. Опускайтесь плавно до угла около 90° в локтях, грудью почти касаясь пола, затем мощно выжимайтесь вверх, не прогибая поясницу.'},
    {n:'Разведение гантелей лёжа (флаи)', t:'Лягте на горизонтальную скамью, гантели держите над грудью с лёгким фиксированным изгибом в локтях на протяжении всего движения. Опускайте руки в стороны по широкой дуге до ощущения растяжения в груди, не роняя вес рывком. Сводите гантели тем же путём вверх, представляя, будто обнимаете большое дерево.'},
    {n:'Разведение гантелей на наклонной скамье', t:'Скамья под углом 30°. Сохраняя тот же фиксированный изгиб локтей, опускайте гантели по дуге в стороны, акцентируя нагрузку на верхнюю часть груди. Возврат выполняйте плавно, без раскачивания корпусом и без помощи инерции.'},
    {n:'Отжимания на брусьях (грудной акцент)', t:'Возьмитесь за брусья, корпус наклоните вперёд, ноги слегка согните и скрестите. Опускайтесь до ощущения растяжения в груди, не проваливая плечи ниже уровня локтей. Выжимайтесь вверх, сохраняя наклон корпуса, чтобы нагрузка оставалась на грудных, а не на трицепсе.'},
    {n:'Кроссовер в блочном тренажёре (снизу вверх)', t:'Установите рукояти на нижние блоки, встаньте по центру с небольшим наклоном корпуса вперёд, одна нога впереди для устойчивости. Сводите рукояти по дуге снизу вверх перед собой, в конечной точке слегка скрещивая кисти. На негативной фазе контролируйте растяжение, не давая блокам резко тянуть руки назад.'},
    {n:'Кроссовер в блочном тренажёре (сверху вниз)', t:'Рукояти закреплены на верхних блоках. Сводите руки по дуге сверху вниз к низу живота, локти слегка согнуты и зафиксированы. Работайте за счёт грудных мышц, а не за счёт наклонов корпуса вперёд-назад.'},
    {n:'Жим в тренажёре Смита', t:'Траектория штанги задана направляющими, что позволяет сосредоточиться на технике. Расположитесь так, чтобы гриф опускался к нижней-средней части груди, локти не разводите слишком широко. Опускайте вес подконтрольно, выжимайте вверх без полного «выключения» локтевого сустава.'},
    {n:'Жим в тренажёре сидя (Хаммер)', t:'Отрегулируйте сиденье так, чтобы рукояти находились на уровне середины груди. Выжимайте рукояти вперёд, полностью не выпрямляя локти в конечной точке, и возвращайте вес медленно, ощущая растяжение груди.'},
    {n:'Пуловер с гантелью', t:'Лягте поперёк скамьи, лопатки на скамье, таз чуть ниже. Держите гантель двумя руками над грудью, руки слегка согнуты в локтях. Опускайте гантель за голову по дуге, ощущая растяжение грудной клетки и широчайших, затем возвращайте в исходное положение, не разгибая локти сильнее заданного угла.'},
    {n:'Отжимания с широкой постановкой рук', t:'Руки расставьте заметно шире плеч, пальцы слегка развёрнуты наружу. Опускайтесь до комфортной глубины, сохраняя прямую линию тела, акцент смещается на внешнюю часть груди. Избегайте чрезмерного прогиба в пояснице.'},
    {n:'Жим гантелей лёжа на горизонтальной скамье', t:'Лягте на скамью, гантели держите на уровне груди хватом сверху. Опускайте гантели медленно до уровня груди с амплитудой чуть большей, чем со штангой, за счёт независимого движения рук, затем выжимайте вверх, сводя гантели по дуге.'},
    {n:'Жим узким хватом на скамье (грудь-трицепс)', t:'Хват на ширине плеч или чуть уже. Опускайте штангу к нижней части груди, локти двигаются ближе к корпусу. Это упражнение нагружает грудь и трицепс одновременно, следите, чтобы запястья оставались прямыми под грифом.'}
  ],
  back:[
    {n:'Становая тяга классическая', t:'Встаньте вплотную к грифу, ноги на ширине таза, гриф над серединой стопы. Возьмитесь за гриф чуть шире ног, спина прямая, грудь развёрнута, лопатки над грифом. Тяните штангу вверх за счёт одновременного разгибания ног и корпуса, гриф скользит вдоль голеней, в верхней точке лопатки сведены, поясница не прогибается избыточно назад.'},
    {n:'Подтягивания широким хватом', t:'Возьмитесь за перекладину хватом шире плеч, ладони от себя. Подтягивайтесь за счёт сведения лопаток и работы широчайших, стараясь коснуться перекладины верхом груди. Опускайтесь плавно до полного выпрямления рук, без рывков и раскачивания корпусом.'},
    {n:'Подтягивания узким обратным хватом', t:'Хват уже плеч, ладони к себе. Подтягивайтесь, ведя подбородок к перекладине, локти двигаются вдоль корпуса. Это упражнение сильнее подключает широчайшие и бицепс, спину держите прямой, без раскачивания.'},
    {n:'Тяга штанги в наклоне', t:'Наклоните корпус вперёд примерно на 45°, колени слегка согнуты, спина прямая на протяжении всего подхода. Тяните гриф к нижней части живота, локти двигаются вдоль корпуса и уходят назад, лопатки сводите в верхней точке. Опускайте штангу подконтрольно, не позволяя спине округляться.'},
    {n:'Тяга штанги в наклоне обратным хватом', t:'Хват снизу, чуть уже плеч. Наклон корпуса и техника тяги аналогичны прямому хвату, но обратный хват сильнее включает нижнюю часть широчайших и бицепс. Следите, чтобы движение шло за счёт спины, а не рывка руками.'},
    {n:'Тяга верхнего блока широким хватом', t:'Сядьте, зафиксируйте бёдра валиками, возьмитесь за рукоять широким хватом. Тяните рукоять вниз к верхней части груди за счёт локтей, слегка отклоняя корпус назад не более чем на 10–15°. Возврат выполняйте плавно, полностью растягивая широчайшие вверху.'},
    {n:'Тяга верхнего блока узким хватом', t:'Используйте узкую V-образную рукоять. Тяните её к груди, локти прижаты ближе к корпусу, лопатки сводите в нижней точке движения. Узкий хват лучше прорабатывает середину спины.'},
    {n:'Тяга гантели одной рукой в упоре', t:'Обопритесь коленом и ладонью одноимённой стороны на скамью, спина параллельна полу и прямая. Тяните гантель к поясу, локоть двигается вдоль корпуса, в верхней точке лопатка сведена. Корпус зафиксирован, без скручивания и рывков.'},
    {n:'Тяга нижнего блока сидя', t:'Сядьте, упритесь стопами в платформу, колени слегка согнуты. Тяните рукоять к животу, сохраняя прямую спину, в конечной точке сводите лопатки. На возврате не позволяйте плечам уходить вперёд с округлением спины.'},
    {n:'Тяга Т-грифа', t:'Встаньте над грифом в упоре, корпус наклонён вперёд, спина прямая. Тяните рукоять к груди/животу за счёт сведения лопаток и работы широчайших, локти идут вдоль корпуса. Избегайте резких рывков корпусом для придания инерции.'},
    {n:'Гиперэкстензия', t:'Расположите таз на подушке тренажёра, ноги зафиксированы, корпус свободно свисает вниз. Сгибание происходит преимущественно в тазобедренных суставах, спина остаётся ровной. Поднимайте корпус до линии, параллельной полу, без чрезмерного переразгибания поясницы вверху.'},
    {n:'Пуловер на блоке стоя', t:'Встаньте перед верхним блоком, возьмитесь за рукоять прямыми или слегка согнутыми руками. Тяните рукоять вниз по дуге к бёдрам за счёт широчайших, корпус слегка наклонён вперёд. Возврат выполняйте медленно, ощущая растяжение спины.'},
    {n:'Шраги со штангой', t:'Возьмите штангу хватом сверху на ширине плеч, руки прямые. Поднимайте плечи строго вверх, к ушам, без вращения плечами по кругу. В верхней точке задержитесь на секунду, затем медленно опустите плечи вниз.'},
    {n:'Шраги с гантелями', t:'Гантели держите вдоль корпуса. Поднимайте плечи вертикально вверх, избегая помощи руками через сгибание локтей. Движение должно быть плавным, без рывков и раскачивания корпусом.'},
    {n:'Наклоны со штангой на спине («доброе утро»)', t:'Штангу расположите на верхней части трапеций, как при приседе. Слегка согните колени, наклоняйте корпус вперёд с прямой спиной, отводя таз назад, до ощущения растяжения задней поверхности бедра. Возвращайтесь в исходное положение за счёт разгибания в тазобедренных суставах, работайте с небольшим весом до отработки техники.'}
  ],
  legs:[
    {n:'Приседания со штангой на спине', t:'Расположите штангу на верхней части трапеций, ноги на ширине плеч, носки слегка развёрнуты. Приседайте, отводя таз назад и вниз, до параллели бёдер с полом или чуть ниже, колени двигаются в направлении носков. Поднимайтесь за счёт усилия ног и корпуса, не округляя поясницу.'},
    {n:'Фронтальные приседания', t:'Штангу удерживайте на передних дельтах и ключицах, локти подняты вперёд. Корпус держите максимально вертикально, приседайте до параллели, колени двигаются вперёд-в стороны по направлению носков. Такая техника сильнее нагружает переднюю поверхность бедра.'},
    {n:'Жим ногами в тренажёре', t:'Расположите стопы на платформе на ширине плеч, поясница плотно прижата к спинке. Опускайте платформу до угла около 90° в коленях, не отрывая поясницу от опоры. Выжимайте платформу вверх, не разгибая колени резко до конца хода.'},
    {n:'Выпады с гантелями', t:'Держите гантели вдоль корпуса, сделайте широкий шаг вперёд. Опускайтесь, сгибая оба колена примерно до 90°, заднее колено почти касается пола. Оттолкнитесь передней ногой, возвращаясь в исходное положение, сохраняя корпус вертикально.'},
    {n:'Болгарские выпады', t:'Поставьте одну ногу подъёмом на скамью позади себя, вторая нога впереди на расстоянии шага. Приседайте на передней ноге до угла около 90° в колене, корпус слегка наклонён вперёд. Это упражнение требует хорошего баланса, начинайте с небольшого веса.'},
    {n:'Румынская тяга со штангой', t:'Держите штангу хватом сверху, колени слегка согнуты и зафиксированы. Наклоняйте корпус вперёд с прямой спиной, отводя таз назад, штанга скользит вдоль передней поверхности ног. Опускайтесь до растяжения задней поверхности бедра, затем возвращайтесь за счёт работы ягодиц и бицепса бедра.'},
    {n:'Румынская тяга с гантелями', t:'Гантели держите вдоль передней поверхности бёдер. Техника аналогична варианту со штангой: наклон корпуса вперёд с прямой спиной, таз уходит назад, колени слегка согнуты. Гантели позволяют лучше контролировать траекторию у голеней.'},
    {n:'Сгибание ног в тренажёре лёжа', t:'Лягте на живот, валик тренажёра расположите чуть выше пяток. Сгибайте голени к ягодицам за счёт бицепса бедра, таз прижат к скамье. На возврате контролируйте движение, не позволяя весу падать резко.'},
    {n:'Разгибание ног в тренажёре', t:'Сядьте, спина прижата к спинке, валик — над голеностопом. Разгибайте колени плавно до почти полного выпрямления, с короткой паузой вверху, затем медленно возвращайте вес, не бросая его.'},
    {n:'Подъём на носки стоя', t:'Встаньте на платформу тренажёра носками, пятки свисают. Поднимайтесь на носках максимально высоко, задержитесь на секунду в верхней точке, затем медленно опускайте пятки ниже уровня платформы для полного растяжения икр.'},
    {n:'Подъём на носки сидя', t:'Сидя, валик тренажёра расположен на нижней части бёдер. Поднимайте пятки вверх за счёт икроножных мышц, задержитесь вверху, затем медленно опускайтесь в нижнюю точку с растяжением.'},
    {n:'Гакк-приседания в тренажёре', t:'Спина плотно прижата к спинке тренажёра, стопы на платформе на ширине плеч. Опускайтесь, сгибая колени до угла около 90°, колени двигаются по направлению носков. Поднимайтесь, не разгибая колени резко в конечной точке.'},
    {n:'Приседания в тренажёре Смита', t:'Стопы расположите чуть впереди грифа для более вертикальной траектории. Приседайте до параллели бёдер с полом, контролируя движение за счёт направляющих тренажёра. Это позволяет безопасно работать с большим весом без страхующего.'},
    {n:'Ягодичный мостик со штангой', t:'Лягте лопатками на скамью, штангу расположите на бёдрах, стопы на ширине таза. Поднимайте таз вверх за счёт ягодиц до прямой линии от плеч до колен, задержитесь вверху, затем опускайте таз подконтрольно, не роняя штангу.'},
    {n:'Становая тяга на прямых ногах', t:'Ноги почти прямые, с минимальным сгибом в коленях, штанга у бёдер. Наклоняйте корпус вперёд, отводя таз назад, спина остаётся прямой на всей амплитуде. Работайте в комфортном диапазоне, не допуская округления поясницы.'}
  ],
  shoulders:[
    {n:'Жим гантелей сидя', t:'Сядьте со спинкой, гантели стартуют на уровне плеч, ладони вперёд. Выжимайте гантели вверх по слегка сходящейся траектории, не сводя локти в жёсткий замок вверху. Опускайте гантели подконтрольно обратно до уровня плеч.'},
    {n:'Жим штанги стоя (армейский жим)', t:'Штангу держите на уровне ключиц хватом чуть шире плеч, корпус напряжён, ягодицы и пресс включены. Выжимайте штангу строго вверх, слегка уводя голову назад в момент прохождения лица. Не прогибайте поясницу для помощи движению.'},
    {n:'Жим штанги сидя из-за головы', t:'Выполняйте только при хорошей подвижности плечевых суставов. Сидя со спинкой, опускайте штангу за голову до уровня ушей неглубоко, затем выжимайте вверх. При дискомфорте в плечах замените упражнение жимом перед собой.'},
    {n:'Махи гантелями в стороны стоя', t:'Гантели держите вдоль корпуса с лёгким фиксированным изгибом в локтях. Поднимайте руки через стороны до уровня плеч, не выше, слегка наклоняя мизинец вверх в конечной точке. Опускайте плавно, без раскачивания корпусом.'},
    {n:'Махи гантелями в стороны сидя', t:'Сидя на скамье без опоры для спины, выполняйте то же движение, что и стоя. Отсутствие возможности читинга корпусом делает упражнение более строгим для средней дельты.'},
    {n:'Махи в наклоне на заднюю дельту', t:'Наклоните корпус вперёд примерно на 90°, спина прямая, гантели свисают под плечами. Поднимайте руки в стороны и слегка назад, сводя лопатки в верхней точке. Локти держите с небольшим фиксированным изгибом.'},
    {n:'Обратная бабочка в тренажёре', t:'Сядьте лицом к тренажёру, возьмитесь за рукояти. Разводите руки назад по дуге, сводя лопатки, лёгкий изгиб в локтях сохраняется на всём движении. Возврат выполняйте подконтрольно, не позволяя весу тянуть плечи вперёд рывком.'},
    {n:'Тяга штанги к подбородку', t:'Хват уже плеч, гриф близко к корпусу. Тяните штангу вверх, ведя локти выше уровня кистей, до уровня нижней части груди-подбородка. Работайте в комфортной амплитуде, при дискомфорте в плечах уменьшите высоту подъёма.'},
    {n:'Жим Арнольда', t:'Начните с гантелей у плеч ладонями к себе. В процессе выжимания разворачивайте кисти наружу, заканчивая движение ладонями вперёд вверху. Опускание выполняйте в обратном порядке, разворачивая ладони обратно к себе.'},
    {n:'Подъём гантелей перед собой', t:'Держите гантели перед бёдрами хватом сверху. Поднимайте одну или обе руки перед собой до уровня плеч, слегка сгибая локоть. Опускайте медленно, не раскачивая корпус для придания инерции.'},
    {n:'Махи в кроссовере на заднюю дельту', t:'Встаньте между стойками кроссовера, возьмите рукояти накрест. Разводите руки в стороны-назад, сводя лопатки, корпус слегка наклонён вперёд. Постоянное натяжение троса делает нагрузку более равномерной, чем с гантелями.'},
    {n:'Жим в тренажёре для плеч', t:'Отрегулируйте сиденье так, чтобы рукояти стартовали на уровне плеч. Выжимайте рукояти вверх, не разгибая локти полностью в замок, и возвращайте вес подконтрольно вниз.'},
    {n:'Разведение на пек-дек в обратную сторону', t:'Сядьте лицом к спинке тренажёра, возьмитесь за рукояти перед собой. Разводите руки назад, сводя лопатки и напрягая заднюю дельту, локти слегка согнуты на протяжении движения.'},
    {n:'Круговые вращения с лёгкими гантелями', t:'Возьмите гантели небольшого веса, руки слегка разведены в стороны. Выполняйте небольшие круговые движения вперёд и назад, сохраняя напряжение в дельтах, не раскачивая корпус.'},
    {n:'Подъём плеч через стороны на нижнем блоке', t:'Встаньте боком к нижнему блоку, возьмитесь за рукоять дальней от блока рукой. Поднимайте руку через сторону до уровня плеча, сохраняя постоянное натяжение троса, затем медленно опускайте.'}
  ],
  triceps:[
    {n:'Французский жим лёжа со штангой', t:'Лягте на скамью, штангу (лучше EZ-гриф) держите над грудью на прямых руках. Сгибая только локти, опускайте гриф ко лбу или чуть за голову, плечи остаются неподвижными и вертикальными. Разгибайте руки обратно вверх за счёт трицепса, не разводя локти в стороны.'},
    {n:'Французский жим сидя с гантелью', t:'Сидя, держите одну гантель двумя руками за диск над головой, локти направлены вверх и прижаты к ушам. Опускайте гантель за голову, сгибая локти, затем разгибайте руки вверх, не разводя локти в стороны.'},
    {n:'Разгибание рук на верхнем блоке с канатом', t:'Встаньте перед блоком, возьмитесь за концы каната хватом сверху, локти прижаты к корпусу. Разгибайте руки вниз, в конце движения разводя концы каната в стороны для полного сокращения трицепса. Возвращайте руки подконтрольно, не позволяя локтям уходить вперёд.'},
    {n:'Разгибание рук на блоке прямой рукоятью', t:'Хват сверху на прямой рукояти, локти прижаты к корпусу и неподвижны. Разгибайте руки вниз до полного выпрямления, без рывков корпусом, затем медленно возвращайте в исходное положение.'},
    {n:'Отжимания узким хватом', t:'Расположите руки на ширине плеч или чуть уже, пальцы направлены вперёд. Опускайтесь, прижимая локти к корпусу, а не разводя их в стороны, тело держите прямой линией. Выжимайтесь вверх за счёт трицепса.'},

    {n:'Обратные отжимания от скамьи', t:'Расположите ладони на краю скамьи позади себя, ноги вытянуты вперёд. Опускайте таз вниз, сгибая локти назад, до угла около 90°, затем выжимайтесь вверх за счёт трицепса, не проваливая плечи к ушам.'},

    {n:'Разгибание рук в трицепс-машине', t:'Расположите руки на подлокотниках тренажёра согласно инструкции, локти зафиксированы в шарнире тренажёра. Разгибайте предплечья вперёд-вниз за счёт трицепса, затем возвращайте подконтрольно.'},

function patternFor(muscleId, name){
  const n = name.toLowerCase();
  if(muscleId==='cardio') return 'cardio';
  if(muscleId==='abs') return 'core';
  if(muscleId==='biceps'){ return n.includes('подтягивания') ? 'pull' : 'curl'; }
  if(muscleId==='triceps'){ return (n.includes('отжимания')||n.includes('жим')) ? 'press' : 'extension'; }
  if(muscleId==='shoulders'){
    if(n.includes('мах')||n.includes('развед')||n.includes('подъём')||n.includes('вращен')||n.includes('бабочка')) return 'raise';
    if(n.includes('подбородку')) return 'pull';
    return 'press';
  }
  if(muscleId==='chest'){
    if(n.includes('развед')||n.includes('кроссовер')) return 'raise';
    if(n.includes('пуловер')) return 'pull';
    return 'press';
  }
  if(muscleId==='back'){
    if(n.includes('становая')||n.includes('гиперэкстенз')||n.includes('наклоны')||n.includes('мостик')) return 'hinge';
    return 'pull';
  }
  if(muscleId==='legs'){
    if(n.includes('румынская')||n.includes('становая')||n.includes('мостик')) return 'hinge';
    if(n.includes('сгибание ног')) return 'curl';
    if(n.includes('разгибание ног')) return 'extension';
    if(n.includes('носк')) return 'raise';
    return 'squat';
  }
  return 'press';
}
function gifBoxHTML(muscleId, name){
  const p = PATTERNS[patternFor(muscleId, name)];
  return `<div class="gif-box">${p.svg}<div class="gif-cap">${p.cap}</div></div>`;
}

/* ---- пользовательские упражнения (сохраняются между сеансами) ---- */
let customExercises = {};
MUSCLES.forEach(m=>{ customExercises[m.id] = []; });

async function loadCustomExercises(){
  try{
    const res = await window.storage.get('custom-exercises', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      MUSCLES.forEach(m=>{ customExercises[m.id] = parsed[m.id] || []; });
    }
  }catch(e){ /* сохранённых упражнений ещё нет или хранилище недоступно */ }
  render();
}
async function saveCustomExercises(){
  try{ await window.storage.set('custom-exercises', JSON.stringify(customExercises), false); }
  catch(e){ /* изменения останутся только в этой сессии */ }
}
function buildAddCustomSection(muscleId){
  const wrap = el(`<div></div>`);
  if(!addFormOpen[muscleId]){
    const btn = el(`<button class="add-custom-btn">+ Добавить своё упражнение</button>`);
    btn.onclick = ()=>{ addFormOpen[muscleId]=true; render(); };
    wrap.appendChild(btn);
  } else {
    const form = el(`<div class="custom-form">
      <input type="text" class="cf-name" placeholder="Название упражнения" maxlength="60">
      <textarea class="cf-tech" placeholder="Техника выполнения (по желанию)" rows="3"></textarea>
      <div class="cf-btns">
        <button class="cf-save">Сохранить</button>
        <button class="cf-cancel">Отмена</button>
      </div>
    </div>`);
    form.querySelector('.cf-save').onclick = ()=>{
      const name = form.querySelector('.cf-name').value.trim();
      const tech = form.querySelector('.cf-tech').value.trim();
      if(!name) return;
      customExercises[muscleId].push({n:name, t: tech || 'Описание техники не указано — при желании вы можете отредактировать его позже, добавив новую версию упражнения.'});
      saveCustomExercises();
      addFormOpen[muscleId]=false;
      render();
    };
    form.querySelector('.cf-cancel').onclick = ()=>{ addFormOpen[muscleId]=false; render(); };
    wrap.appendChild(form);
  }
  return wrap;
}

  customExercises[m.id].forEach((ex, cidx)=>{

/* ---------- ТАЙМЕР ОТДЫХА ---------- */
const PRESETS = [30,60,90,120,180];
function renderTimer(c){
  setTitle('Таймер отдыха');
  const wrap = el(`<div class="timer-wrap"></div>`);
  const r = 100, circ = 2*Math.PI*r;
  const pct = timer.remaining/timer.total;
  const offset = circ*(1-pct);
  wrap.appendChild(el(`
    <div class="plate">
      <svg viewBox="0 0 230 230">
        <circle class="plate-ring-bg" cx="115" cy="115" r="${r}"/>
        <circle class="plate-ring" cx="115" cy="115" r="${r}" stroke-dasharray="${circ}" stroke-dashoffset="${offset}"/>
      </svg>
      <div class="plate-center">
        <div class="digits" id="timerDigits">${fmt(timer.remaining)}</div>
        <div class="lbl2">${timer.running?'Отдых':'Готов'}</div>
      </div>
    </div>
  `));
  const controls = el(`<div class="timer-controls"></div>`);
  const startBtn = el(`<button class="tbtn primary">${timer.running?'Пауза':'Старт'}</button>`);
  startBtn.onclick = toggleTimer;
  const resetBtn = el(`<button class="tbtn">Сброс</button>`);
  resetBtn.onclick = ()=>{ stopTimer(); timer.remaining = timer.total; render(); };
  controls.appendChild(startBtn); controls.appendChild(resetBtn);
  wrap.appendChild(controls);

  const presets = el(`<div class="presets"></div>`);
  PRESETS.forEach(p=>{
    const chip = el(`<div class="preset ${timer.total===p?'active':''}">${p}с</div>`);
    chip.onclick = ()=>{ stopTimer(); timer.total=p; timer.remaining=p; render(); };
    presets.appendChild(chip);
  });
  wrap.appendChild(presets);

  const custom = el(`<div class="custom-row">
    <input type="number" id="customSec" placeholder="сек" min="5" max="600">
    <span>секунд</span>
    <button>Задать</button>
  </div>`);
  custom.querySelector('button').onclick = ()=>{
    const v = parseInt(document.getElementById('customSec').value);
    if(v && v>0){ stopTimer(); timer.total=v; timer.remaining=v; render(); }
  };
  wrap.appendChild(custom);

  c.appendChild(wrap);
}
function fmt(s){ const m=Math.floor(s/60); const sec=s%60; return `${m}:${sec.toString().padStart(2,'0')}`; }
function toggleTimer(){
  if(timer.running){ stopTimer(); }
  else{
    timer.running = true;
    timer.interval = setInterval(()=>{
      timer.remaining--;
      if(timer.remaining<=0){
        stopTimer();
        timer.remaining=0;
        beep();
        if(tab==='timer') render();
        return;
      }
      if(tab==='timer'){
        const d=document.getElementById('timerDigits');
        if(d) d.textContent = fmt(timer.remaining);
        const ring = document.querySelector('.plate-ring');
        if(ring){ const r=100, circ=2*Math.PI*r; ring.setAttribute('stroke-dashoffset', circ*(1-timer.remaining/timer.total)); }
        const lbl = document.querySelector('.lbl2');
      }
    },1000);
  }
  render();
}
function stopTimer(){ timer.running=false; clearInterval(timer.interval); }
function beep(){
  try{
    const ctx = new (window.AudioContext||window.webkitAudioContext)();
    for(let i=0;i<3;i++){
      const o = ctx.createOscillator(); const g = ctx.createGain();
      o.type='sine'; o.frequency.value=880;
      o.connect(g); g.connect(ctx.destination);
      const t0 = ctx.currentTime + i*0.35;
      g.gain.setValueAtTime(0.15, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0+0.25);
      o.start(t0); o.stop(t0+0.25);
    }
  }catch(e){}
  if(navigator.vibrate) navigator.vibrate([200,100,200]);
}

/* ---------- ИСТОРИЯ / ЗАМЕТКИ ---------- */
function renderHistory(c){
  setTitle('История и заметки');
  if(history.length===0){
    c.appendChild(el(`<div class="empty-hint">Здесь появятся все ваши завершённые тренировки: упражнения, вес, повторения и заметки.</div>`));
    return;
  }
  history.forEach((h, hi)=>{
    const card = el(`<div class="hist-card">
      <div class="hist-top">
        <div class="hist-date">${h.date}</div>
        <div class="hist-meta">${h.time} · ${h.exercises.length} упр.</div>
      </div>
      <div class="hist-body ${openHistory[hi]?'open':''}"></div>
    </div>`);
    card.querySelector('.hist-top').onclick = ()=>{ openHistory[hi]=!openHistory[hi]; render(); };
    const body = card.querySelector('.hist-body');
    h.exercises.forEach(ex=>{
      const setsStr = ex.sets.filter(s=>s.w||s.r).map(s=>`${s.w||'?'}кг×${s.r||'?'}`).join(', ') || 'без данных';
      body.appendChild(el(`<div class="hist-ex-line"><b>${ex.name}</b> — ${setsStr}</div>`));
    });
    if(h.note){ body.appendChild(el(`<div class="hist-note">${h.note}</div>`)); }
    const del = el(`<button class="del-hist">Удалить запись</button>`);
    del.onclick = (e)=>{ e.stopPropagation(); history.splice(hi,1); render(); };
    body.appendChild(del);
    c.appendChild(card);
  });
}

render();
</script>
